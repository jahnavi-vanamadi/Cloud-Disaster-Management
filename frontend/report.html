</header>

<main class="page">
    <div class="page-header">
        <div>
            <span class="section-label">EMERGENCY REPORT</span>
            <h1>Report a Disaster</h1>
            <p>
                Provide details about the disaster so emergency teams
                can respond quickly.
            </p>
        </div>
    </div>

```
<section class="panel">
    <form id="reportForm">

        <div class="form-group">
            <label for="name">Your Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >
        </div>

        <div class="form-group">
            <label for="disaster_type">Disaster Type</label>
            <select id="disaster_type" name="disaster_type" required>
                <option value="">Select disaster type</option>
                <option value="Flood">Flood</option>
                <option value="Fire">Fire</option>
                <option value="Storm">Storm</option>
                <option value="Earthquake">Earthquake</option>
                <option value="Cyclone">Cyclone</option>
                <option value="Landslide">Landslide</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input
                type="text"
                id="location"
                name="location"
                placeholder="Enter disaster location"
                required
            >
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Describe what happened..."
                required
            ></textarea>
        </div>

        <div class="form-group">
            <label for="severity">Severity</label>
            <select id="severity" name="severity" required>
                <option value="">Select severity</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
        </div>

        <button
            type="submit"
            class="primary-btn"
            id="submitReportBtn"
        >
            Submit Disaster Report
        </button>

        <p
            id="reportMessage"
            role="status"
            aria-live="polite"
            style="margin-top: 15px;"
        ></p>

    </form>
</section>
```
