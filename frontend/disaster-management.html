<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Management | ResQCloud</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/disasters.css">
</head>

<body>

<header class="navbar">

    <div class="logo">☁️ ResQCloud</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="report.html">Report Disaster</a>
        <a href="disaster-management.html" class="active">Disasters</a>
        <a href="alerts.html">Alerts</a>
        <a href="resources.html">Resources</a>
    </nav>

    <a href="admin.html" class="admin-btn">Admin</a>

</header>


<main class="page">

    <div class="page-header">

        <div>
            <span class="section-label">INCIDENT MONITORING</span>
            <h1>Disaster Reports</h1>
            <p>View currently reported disaster incidents.</p>
        </div>

        <a href="report.html" class="primary-btn">
            + Report Disaster
        </a>

    </div>


    <div class="filter-bar">

        <input
            type="text"
            id="searchDisaster"
            placeholder="🔍 Search location or description..."
        >

        <select id="typeFilter">
            <option value="all">All Types</option>
            <option value="flood">Flood</option>
            <option value="fire">Fire</option>
            <option value="cyclone">Cyclone</option>
            <option value="storm">Storm</option>
            <option value="earthquake">Earthquake</option>
            <option value="landslide">Landslide</option>
            <option value="other">Other</option>
        </select>

        <select id="locationFilter">
            <option value="all">All Locations</option>
        </select>

        <select id="severityFilter">
            <option value="all">All Severity</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>

        <select id="statusFilter">
            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="monitoring">Monitoring</option>
            <option value="resolved">Resolved</option>
        </select>

        <select id="sourceFilter">
            <option value="all">All Sources</option>
            <option value="community">Community Reports (unverified)</option>
            <option value="usgs">USGS Earthquakes (official)</option>
        </select>

    </div>

    <p class="result-count" id="resultCount"></p>


    <div class="disaster-grid" id="disasterList">

        <p>Loading disaster reports...</p>

    </div>

</main>


<!-- DETAILS POPUP -->
<div class="modal-backdrop" id="detailsModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
        <div id="modalBody"></div>
    </div>
</div>





<footer>
    <p>© 2026 ResQCloud. Academic Project.</p>
</footer>


<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>
<script src="js/disaster-management.js"></script>

</body>
</html>
