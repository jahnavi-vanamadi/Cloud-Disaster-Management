<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disasters | ResQCloud</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">☁️ ResQCloud</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="report.html">Report Disaster</a>
        <a href="disasters.html" class="active">Disasters</a>
        <a href="resources.html">Resources</a>
    </nav>

    <a href="admin.html" class="admin-btn">Admin</a>

</header>


<main class="page">

    <div class="page-header">

        <div>
            <span class="section-label">INCIDENT MONITORING</span>
            <h1>Disaster Reports</h1>
            <p>View currently reported disaster incidents.</p>
        </div>

        <a href="report.html" class="primary-btn">
            + Report Disaster
        </a>

    </div>


    <div class="filter-bar">

        <input
            type="text"
            id="searchDisaster"
            placeholder="🔍 Search location or disaster..."
        >

        <select id="typeFilter">
            <option value="all">All Types</option>
            <option value="flood">Flood</option>
            <option value="fire">Fire</option>
            <option value="cyclone">Cyclone</option>
            <option value="storm">Storm</option>
            <option value="earthquake">Earthquake</option>
            <option value="landslide">Landslide</option>
        </select>

        <select id="statusFilter">
            <option value="all">All Severity</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>

    </div>


    <!-- REAL REPORTS FROM BACKEND -->

    <div class="disaster-grid" id="disasterList">

        <p>Loading disaster reports...</p>

    </div>

</main>


<footer>
    <p>© 2026 ResQCloud. Academic Project.</p>
</footer>


<script src="js/disasters.js"></script>

</body>
</html>
